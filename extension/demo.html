<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מסך דמו — QA Companion</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 30px auto; color: #1d2330; }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
  .btns { margin-top: 18px; display: flex; gap: 8px; }
  button { padding: 8px 14px; border-radius: 6px; border: 1px solid #aab; background: #fff; cursor: pointer; }
  #msg { margin-top: 14px; padding: 8px; border-radius: 6px; }
  #msg.err { background: #f8d7da; } #msg.ok { background: #d4edda; }
  .note { color: #666; font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>
<h2>טופס דמו לתרגול</h2>
<p class="note">מסך זה מדגים את הבדיקות שהתוסף יודע לייצר. אין כאן נתונים אמיתיים, ולא נשלח דבר לשרת.</p>

<form id="f" novalidate>
  <label for="fname">שם משפחה (חובה, עד 30 תווים)</label>
  <input id="fname" name="lastName" required maxlength="30">

  <label for="femail">מייל</label>
  <input id="femail" name="email" type="email">

  <label for="fage">גיל (18–120)</label>
  <input id="fage" name="age" type="number" min="18" max="120">

  <label for="fdate">תאריך לידה</label>
  <input id="fdate" name="birth" type="date">

  <label for="ftel">טלפון</label>
  <input id="ftel" name="phone" type="tel">

  <div class="btns">
    <button type="submit" id="save">שמור</button>
    <button type="button" id="del">מחק רשומה</button>
  </div>
</form>

<div id="msg" role="alert" hidden></div>

<script>
  const f = document.getElementById('f');
  const msg = document.getElementById('msg');
  const show = (text, ok) => {
    msg.hidden = false;
    msg.textContent = text;
    msg.className = ok ? 'ok' : 'err';
  };

  f.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!f.reportValidity()) return show('יש שגיאות בטופס', false);
    show('הפרטים נשמרו', true);
  });

  document.getElementById('del').addEventListener('click', () => {
    show('הרשומה נמחקה', true);
  });
</script>
</body>
</html>
